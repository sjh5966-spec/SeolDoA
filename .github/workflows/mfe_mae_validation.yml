name: MFE MAE Exit Validation

on:
  push:
    branches: [main]
    paths:
      - 'mfe_mae_exit_validation.py'
      - '.github/workflows/mfe_mae_validation.yml'
  workflow_dispatch:

jobs:
  mfe-mae:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas numpy
      - name: Download frozen holding-path input
        uses: actions/download-artifact@v4
        with:
          name: holding-path-validation
          path: holding_path_results
          github-token: ${{ github.token }}
          run-id: 32939329619
      - name: Run MFE MAE validation with retry
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if python mfe_mae_exit_validation.py; then exit 0; fi
            echo "MFE/MAE attempt $i failed; retrying after cooldown"
            sleep 60
          done
          exit 1
      - name: Upload MFE MAE results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfe-mae-exit-validation
          path: mfe_mae_results/
          if-no-files-found: warn
