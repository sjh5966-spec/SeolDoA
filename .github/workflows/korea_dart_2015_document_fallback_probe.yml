name: Korea DART 2015 Document Fallback Probe

on:
  push:
    paths:
      - korea_dart_2015_document_fallback_probe.py
      - .github/workflows/korea_dart_2015_document_fallback_probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Probe 2015 original quarterly filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python korea_dart_2015_document_fallback_probe.py
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_dart_2015_document_fallback_probe.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Probe Korea DART 2015 original quarterly documents"
            git push
          fi
