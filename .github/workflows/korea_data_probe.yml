name: Korea Data Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'korea_data_probe.py'
      - 'KOREA_TURNAROUND_RESEARCH_SPEC.md'
      - '.github/workflows/korea_data_probe.yml'

permissions:
  contents: write

concurrency:
  group: korea-data-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas requests pykrx

      - name: Run point-in-time Korea data probe
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python korea_data_probe.py

      - name: Commit probe outputs
        shell: bash
        run: |
          for f in korea_probe_summary.json korea_probe_krx_universe.csv korea_probe_dart_disclosures.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo 'No probe state changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Korea data probe outputs'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload probe snapshot
        uses: actions/upload-artifact@v4
        with:
          name: korea-data-probe
          path: |
            korea_probe_krx_universe.csv
            korea_probe_summary.json
            korea_probe_dart_disclosures.csv
          if-no-files-found: warn
