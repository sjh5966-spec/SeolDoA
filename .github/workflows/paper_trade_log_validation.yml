name: Paper Trade Log Validation

on:
  push:
    branches: [main]
    paths:
      - 'paper_trade_log.csv'
      - 'paper_trade_log_template.csv'
      - 'validate_paper_trade_log.py'
      - 'PAPER_TRADING_SPEC.md'
      - '.github/workflows/paper_trade_log_validation.yml'
  workflow_dispatch:

jobs:
  validate-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas
      - name: Validate paper trading log
        run: python validate_paper_trade_log.py paper_trade_log.csv
