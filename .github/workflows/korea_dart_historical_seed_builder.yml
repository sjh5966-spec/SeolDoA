name: Korea DART Historical Seed Builder

on:
  push:
    paths:
      - 'korea_dart_historical_universe_20??.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python korea_dart_historical_seed_builder.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-dart-historical-seed
          path: |
            korea_dart_historical_seed_2015_2020.csv
            korea_dart_historical_seed_2015_2020_summary.json
      - name: Commit seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_dart_historical_seed_2015_2020.csv korea_dart_historical_seed_2015_2020_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Korea DART historical accounting seed'
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i*3))
          done
          echo 'Push race persisted; artifact preserves seed'
