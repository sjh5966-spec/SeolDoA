name: Korea DART Seed Diagnostic

on:
  push:
    paths:
      - korea_dart_seed_diagnostic.py
      - .github/workflows/korea_dart_seed_diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Diagnose seed identifiers and 2015 report availability
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python korea_dart_seed_diagnostic.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_dart_seed_diagnostic_2015.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Diagnose Korea DART 2015 seed identifiers"
            git push
          fi
