name: Korea DART Bulk Source Inspect

on:
  push:
    paths:
      - korea_dart_bulk_source_inspect.py
      - .github/workflows/korea_dart_bulk_source_inspect.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python korea_dart_bulk_source_inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-dart-bulk-source-inspect
          path: korea_dart_bulk_source_inspect.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_dart_bulk_source_inspect.json
          git commit -m 'Inspect OpenDART bulk download source' || exit 0
          git pull --rebase origin main && git push
