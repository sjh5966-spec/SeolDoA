name: Korea V2 OOS Data Acquire

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/korea_turnaround_v2_oos_data.yml'

permissions:
  contents: read
  actions: read

jobs:
  universe:
    strategy:
      fail-fast: false
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas requests
      - name: Collect PIT universe
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_UNIVERSE_YEAR: ${{ matrix.year }}
        run: python korea_turnaround_v2_oos_historical_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-oos-data-universe-${{ matrix.year }}
          retention-days: 90
          path: |
            korea_dart_historical_universe_${{ matrix.year }}.csv
            korea_dart_historical_universe_${{ matrix.year }}_summary.json

  freeze:
    needs: universe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-oos-data-universe-*
          path: frozen_oos
          merge-multiple: true
      - name: Build frozen universe manifest
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          files=sorted(Path('frozen_oos').glob('*'))
          manifest={'scope':'PIT universe 2015-2025; 2015 is prior context for signals beginning 2016','files':[]}
          for p in files:
              if p.is_file():
                  manifest['files'].append({'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          Path('frozen_oos/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: v2-oos-frozen-universe-2015-2025
          retention-days: 90
          path: frozen_oos/
