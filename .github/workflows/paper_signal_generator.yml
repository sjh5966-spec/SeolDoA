name: Paper Signal Generator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_signal_generator.py'
      - 'paper_filing_date_policy.py'
      - 'paper_batch_allocator.py'
      - 'paper_data_freshness.py'
      - 'paper_portfolio_ledger.py'
      - 'validate_paper_trade_log.py'
      - '.github/workflows/paper_signal_generator.yml'
  schedule:
    - cron: '15 12 * * 1-5'
    - cron: '15 13 * * 1-5'
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: paper-signal-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas numpy
      - name: Check source freshness
        env:
          PAPER_START_DATE: '2026-09-07'
        run: python paper_data_freshness.py
      - name: Generate frozen FCF High paper signals
        env:
          PAPER_START_DATE: '2026-09-07'
          PAPER_INITIAL_CAPITAL: '15000'
          PAPER_MIN_ORDER: '500'
        run: python paper_signal_generator.py
      - name: Apply strict post-filing-date entry policy
        run: python paper_filing_date_policy.py
      - name: Enforce ranked same-scan allocation
        run: python paper_batch_allocator.py
      - name: Validate immutable paper log constraints
        run: python validate_paper_trade_log.py paper_trade_log.csv
      - name: Update paper portfolio lifecycle ledger
        run: python paper_portfolio_ledger.py
      - name: Revalidate after lifecycle update
        run: python validate_paper_trade_log.py paper_trade_log.csv
      - name: Commit paper state
        shell: bash
        run: |
          git add paper_trade_log.csv paper_signal_candidates.csv paper_data_freshness.json paper_portfolio_ledger.csv paper_portfolio_summary.csv
          if git diff --cached --quiet; then
            echo 'No paper state changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update frozen paper trading state'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload paper state snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paper-signal-generator
          path: |
            paper_trade_log.csv
            paper_signal_candidates.csv
            paper_data_freshness.json
            paper_portfolio_ledger.csv
            paper_portfolio_summary.csv
          if-no-files-found: error
