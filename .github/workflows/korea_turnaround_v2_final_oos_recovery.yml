name: Korea Turnaround V2 FINAL OOS Recovery

on:
  push:
    paths:
      - '.github/workflows/korea_turnaround_v2_final_oos_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  SOURCE_RUN_ID: '34798758480'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v2-oos-accounting-seed
          path: .
          repository: sjh5966-spec/SeolDoA
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - id: plan
        shell: python
        run: |
          import json, os, pandas as pd
          d=pd.read_csv('korea_turnaround_v2_oos_seed_2022_2025.csv',dtype=str)
          items=[]; size=15
          for y in [2022,2023,2024,2025]:
              n=int((d.fiscal_year.astype(str)==str(y)).sum())
              for c in range((n+size-1)//size):
                  items.append({'year':y,'chunk':c,'size':size})
          if not items or len(items)>256: raise SystemExit(f'unsafe recovery matrix size {len(items)}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':items},separators=(',',':'))+'\n')
          print('recovery jobs',len(items))

  collect:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v2-oos-accounting-seed
          path: .
          repository: sjh5966-spec/SeolDoA
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Collect frozen OOS accounting in smaller chunk
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_QUARTER_YEAR: ${{ matrix.year }}
          DART_QUARTER_CHUNK: ${{ matrix.chunk }}
          DART_QUARTER_CHUNK_SIZE: ${{ matrix.size }}
        run: python korea_turnaround_v2_oos_quarterly_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-oos-recovery-qacct-${{ matrix.year }}-${{ matrix.chunk }}
          retention-days: 30
          path: |
            korea_dart_quarterly_v2_${{ matrix.year }}_chunk*.csv
            korea_dart_quarterly_v2_${{ matrix.year }}_chunk*_summary.json

  analyze:
    needs: collect
    if: ${{ always() && needs.collect.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-oos-recovery-qacct-*
          path: chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-oos-universe-*
          path: oos_universe
          merge-multiple: true
          repository: sjh5966-spec/SeolDoA
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: korea-validation-quarterly-2021-2022-full-final
          path: validation
          repository: sjh5966-spec/SeolDoA
          run-id: 34725863290
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests pyarrow
      - name: Aggregate recovered OOS accounting
        shell: python
        run: |
          from pathlib import Path
          import pandas as pd
          fs=sorted(Path('chunks').glob('korea_dart_quarterly_v2_*_chunk*.csv'))
          if not fs: raise SystemExit('no recovered OOS accounting chunks')
          d=pd.concat([pd.read_csv(f,dtype={'corp_code':str},low_memory=False) for f in fs],ignore_index=True)
          d=d[pd.to_numeric(d.business_year,errors='coerce').isin([2022,2023,2024,2025])]
          if ((pd.to_numeric(d.business_year)==2025)&d.fiscal_quarter.eq('Q4')).any(): raise SystemExit('2025 Q4 must not be present')
          d.to_csv('korea_turnaround_v2_oos_accounting_2022_2025.csv',index=False)
          print('accounting rows',len(d),'corps',d.corp_code.nunique())
      - name: Stage prior context
        run: cp validation/korea_validation_quarterly_2021_2022_full.csv .
      - name: Run frozen one-time OOS
        run: python korea_turnaround_v2_oos_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-turnaround-v2-final-oos-recovery
          retention-days: 90
          path: |
            korea_turnaround_v2_oos_events.csv
            korea_turnaround_v2_oos_summary.json
            korea_turnaround_v2_oos_accounting_2022_2025.csv
