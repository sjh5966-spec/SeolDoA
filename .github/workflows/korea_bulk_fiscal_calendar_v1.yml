name: Korea Bulk Fiscal Calendar V1

on:
  push:
    paths:
      - korea_bulk_fiscal_calendar_v1.py
      - .github/workflows/korea_bulk_fiscal_calendar_v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python korea_bulk_fiscal_calendar_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-bulk-fiscal-calendar-v1
          path: |
            korea_bulk_fiscal_calendar_2016_2020.csv
            korea_bulk_fiscal_calendar_2016_2020_summary.json
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_bulk_fiscal_calendar_2016_2020.csv korea_bulk_fiscal_calendar_2016_2020_summary.json
          git commit -m 'Build Korea fiscal calendar map' || exit 0
          git pull --rebase origin main && git push
