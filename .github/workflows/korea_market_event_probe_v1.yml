name: Korea Development Market Event Probe V1
on:
  push:
    paths:
      - korea_market_event_probe_v1.py
      - .github/workflows/korea_market_event_probe_v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests
      - run: python korea_market_event_probe_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-development-market-event-probe-v1
          path: |
            korea_market_event_probe_v1.csv
            korea_market_event_probe_v1_summary.json
      - name: Commit compact probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_market_event_probe_v1.csv korea_market_event_probe_v1_summary.json
          git commit -m 'Probe Korea Development candidate market bridge' || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*3)); done
          echo 'Artifact preserves result if push race persists'
