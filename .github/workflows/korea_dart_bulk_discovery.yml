name: Korea DART Bulk Download Discovery

on:
  push:
    paths:
      - korea_dart_bulk_discovery.py
      - .github/workflows/korea_dart_bulk_discovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect OpenDART bulk download page
        run: python korea_dart_bulk_discovery.py
      - name: Commit discovery metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_dart_bulk_discovery.json korea_dart_bulk_endpoint_summary.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect OpenDART bulk download endpoints"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: korea-dart-bulk-discovery
          path: |
            korea_dart_bulk_discovery.json
            korea_dart_bulk_endpoint_summary.json
