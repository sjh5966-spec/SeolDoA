name: Korea DART Quarterly Sequence Repair

on:
  push:
    paths:
      - korea_dart_quarterly_sequence_repair_v1.py
      - korea_dart_quarterly_v2_2016_chunk000.csv
      - korea_dart_quarterly_xbrl_2015.csv
      - .github/workflows/korea_dart_quarterly_sequence_repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python korea_dart_quarterly_sequence_repair_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-dart-quarterly-sequence-checked
          path: |
            *_sequence_checked.csv
            korea_dart_quarterly_sequence_repair_summary.json
      - name: Commit checked outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*_sequence_checked.csv' korea_dart_quarterly_sequence_repair_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enforce Korea DART immediate-quarter sequence rules'
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i*3))
          done
          echo 'Push race persisted; artifact preserves output'
