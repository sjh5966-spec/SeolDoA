name: preentry-execution-validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preentry_execution_validation.py'
      - '.github/workflows/preentry_execution_validation.yml'

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas numpy
      - name: Download frozen MFE/MAE paths
        uses: actions/download-artifact@v4
        with:
          name: mfe-mae-exit-validation
          path: mfe_mae_input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32949639285
      - name: Verify frozen inputs
        run: |
          test -f mfe_mae_input/event_mfe_mae.csv
          test -f mfe_mae_input/daily_path_0_20.csv
      - name: Run pre-entry execution validation with retry
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if python preentry_execution_validation.py; then exit 0; fi
            echo "Pre-entry execution attempt $i failed; retrying after cooldown"
            sleep 60
          done
          exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preentry-execution-validation
          path: preentry_execution_results/
          if-no-files-found: warn
