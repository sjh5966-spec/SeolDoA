name: Trigger Microcap Backtest
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore runner from canonical workflow
        run: |
          PAYLOAD=$(grep "echo 'H4sI" .github/workflows/microcap_backtest.yml | sed "s/.*echo '//;s/' | base64.*//")
          echo "$PAYLOAD" | base64 -d | gzip -d > runner.py
          python -m py_compile runner.py
      - name: Install dependencies
        run: python -m pip install 'duckdb>=1.3' 'numpy>=1.26' 'pandas>=2.2' 'requests>=2.31'
      - name: Run full event study
        env:
          SEC_USER_AGENT: 'microcap-turnaround-research sjh5966-spec@users.noreply.github.com'
        run: python runner.py --workdir results --start-year 2015 --end-year 2026
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microcap-ebit-turnaround-results
          path: results/
          if-no-files-found: warn
