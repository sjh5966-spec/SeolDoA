name: Korea Marcap Pre-OOS Acquire

on:
  push:
    paths:
      - korea_marcap_pre_oos_acquire.py
      - .github/workflows/korea_marcap_pre_oos_acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests
      - run: python korea_marcap_pre_oos_acquire.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-marcap-pre-oos-2015-2022
          retention-days: 30
          path: |
            korea_marcap_raw_2015_2022/*.parquet
            korea_marcap_pre_oos_manifest_2015_2022.csv
            korea_marcap_pre_oos_manifest_2015_2022_summary.json
      - name: Commit manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_marcap_pre_oos_manifest_2015_2022.csv korea_marcap_pre_oos_manifest_2015_2022_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Acquire Korea pre-OOS historical market-data manifest'
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i*3))
          done
          echo 'Push race persisted; artifact preserves files'
