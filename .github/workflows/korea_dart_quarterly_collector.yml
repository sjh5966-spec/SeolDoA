name: Korea DART Quarterly Collector

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Development fiscal year (2015-2020)"
        required: true
        default: "2015"
        type: choice
        options: ["2015","2016","2017","2018","2019","2020"]
      chunk:
        description: "Zero-based chunk index"
        required: true
        default: "0"
      chunk_size:
        description: "Corp-year rows per run; 300 is conservative"
        required: true
        default: "300"
  push:
    paths:
      - korea_dart_quarterly_seed_2015_2020.csv
      - korea_dart_quarterly_collector_v1.py
      - .github/workflows/korea_dart_quarterly_collector.yml

permissions:
  contents: write

concurrency:
  group: korea-dart-quarterly-${{ inputs.year || '2016' }}-${{ inputs.chunk || '0' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Collect Development quarterly accounting
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_QUARTER_YEAR: ${{ inputs.year || '2016' }}
          DART_QUARTER_CHUNK: ${{ inputs.chunk || '0' }}
          DART_QUARTER_CHUNK_SIZE: ${{ inputs.chunk_size || '20' }}
        run: python korea_dart_quarterly_collector_v1.py
      - name: Upload chunk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-dart-quarterly-${{ inputs.year || '2016' }}-chunk-${{ inputs.chunk || '0' }}
          path: |
            korea_dart_quarterly_${{ inputs.year || '2016' }}_chunk*.csv
            korea_dart_quarterly_${{ inputs.year || '2016' }}_chunk*_summary.json
      - name: Commit chunk outputs
        if: success()
        run: |
          YEAR="${{ inputs.year || '2016' }}"
          CHUNK="${{ inputs.chunk || '0' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "korea_dart_quarterly_${YEAR}_chunk"*.csv
          git add "korea_dart_quarterly_${YEAR}_chunk"*_summary.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Collect Korea DART quarterly ${YEAR} chunk ${CHUNK}"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep $((attempt * 2))
            done
            exit 1
          fi
