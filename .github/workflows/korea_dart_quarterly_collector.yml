name: Korea DART Quarterly Collector

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Development fiscal year (2015-2020)"
        required: true
        default: "2015"
        type: choice
        options: ["2015","2016","2017","2018","2019","2020"]
      chunk:
        description: "Zero-based chunk index"
        required: true
        default: "0"
      chunk_size:
        description: "Corp-year rows per run; 300 is conservative"
        required: true
        default: "300"

permissions:
  contents: write

concurrency:
  group: korea-dart-quarterly-${{ inputs.year }}-${{ inputs.chunk }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Collect Development quarterly accounting
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_QUARTER_YEAR: ${{ inputs.year }}
          DART_QUARTER_CHUNK: ${{ inputs.chunk }}
          DART_QUARTER_CHUNK_SIZE: ${{ inputs.chunk_size }}
        run: python korea_dart_quarterly_collector_v1.py
      - name: Commit chunk outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "korea_dart_quarterly_${{ inputs.year }}_chunk"*.csv
          git add "korea_dart_quarterly_${{ inputs.year }}_chunk"*_summary.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Collect Korea DART quarterly ${{ inputs.year }} chunk ${{ inputs.chunk }}"
            git push
          fi
      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: korea-dart-quarterly-${{ inputs.year }}-chunk-${{ inputs.chunk }}
          path: |
            korea_dart_quarterly_${{ inputs.year }}_chunk*.csv
            korea_dart_quarterly_${{ inputs.year }}_chunk*_summary.json
