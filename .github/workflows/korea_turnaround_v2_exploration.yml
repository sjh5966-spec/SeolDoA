name: Korea Turnaround V2 Exploration

on:
  push:
    paths:
      - 'korea_turnaround_v2_exploration.py'
      - '.github/workflows/korea_turnaround_v2_exploration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: korea-validation-quarterly-2021-2022-full-final
          path: .
          repository: sjh5966-spec/SeolDoA
          run-id: 34725863290
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: validation-universe-2021
          path: universe_2021
          repository: sjh5966-spec/SeolDoA
          run-id: 34666220262
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: validation-universe-2022
          path: universe_2022
          repository: sjh5966-spec/SeolDoA
          run-id: 34666220262
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: korea-dart-quarterly-2016-2020-full
          path: development_accounting
          repository: sjh5966-spec/SeolDoA
          run-id: 34325367757
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage strictly pre-OOS inputs
        run: |
          cp development_accounting/korea_dart_quarterly_2016_2020_full.csv .
          cp universe_2021/korea_dart_historical_universe_2021.csv korea_validation_historical_universe_2021.csv
          cp universe_2022/korea_dart_historical_universe_2022.csv korea_validation_historical_universe_2022.csv
          test -f korea_validation_quarterly_2021_2022_full.csv
          echo 'V2 guard: only already-opened 2020-2022 accounting and 2021-2022 market data; 2023+ forbidden.'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests pyarrow
      - run: python korea_turnaround_v2_exploration.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-turnaround-v2-exploration
          retention-days: 30
          path: |
            korea_turnaround_v2_events.csv
            korea_turnaround_v2_summary.json
