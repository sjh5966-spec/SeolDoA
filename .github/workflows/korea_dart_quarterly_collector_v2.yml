name: Korea DART Quarterly Collector V2

on:
  push:
    paths:
      - korea_dart_quarterly_collector_v2.py
      - .github/workflows/korea_dart_quarterly_collector_v2.yml
  workflow_dispatch:
    inputs:
      year:
        description: 'Development year 2015-2020'
        required: true
        default: '2016'
        type: choice
        options: ['2015','2016','2017','2018','2019','2020']
      chunk:
        required: true
        default: '0'
      chunk_size:
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Collect Q1-Q4 accounting smoke
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_QUARTER_YEAR: ${{ inputs.year || '2016' }}
          DART_QUARTER_CHUNK: ${{ inputs.chunk || '0' }}
          DART_QUARTER_CHUNK_SIZE: ${{ inputs.chunk_size || '20' }}
        run: python korea_dart_quarterly_collector_v2.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: korea-dart-quarterly-v2-${{ inputs.year || '2016' }}-${{ inputs.chunk || '0' }}
          path: |
            korea_dart_quarterly_v2_${{ inputs.year || '2016' }}_chunk*.csv
            korea_dart_quarterly_v2_${{ inputs.year || '2016' }}_chunk*_summary.json
      - name: Commit smoke output
        run: |
          Y="${{ inputs.year || '2016' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "korea_dart_quarterly_v2_${Y}_chunk"*.csv "korea_dart_quarterly_v2_${Y}_chunk"*_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Collect Korea DART quarterly v2 ${Y} smoke"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i*3))
          done
          echo 'Push race persisted; artifact preserves result'
