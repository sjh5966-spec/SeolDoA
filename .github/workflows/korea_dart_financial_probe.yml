name: Korea DART Financial Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'korea_dart_financial_probe.py'
      - '.github/workflows/korea_dart_financial_probe.yml'

permissions:
  contents: write

concurrency:
  group: korea-dart-financial-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas requests

      - name: Run OpenDART financial statement probe
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python korea_dart_financial_probe.py

      - name: Commit probe outputs
        shell: bash
        run: |
          git add korea_dart_financial_probe_rows.csv korea_dart_financial_probe_summary.json
          if git diff --cached --quiet; then
            echo 'No financial probe state changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Korea DART financial probe outputs'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload probe snapshot
        uses: actions/upload-artifact@v4
        with:
          name: korea-dart-financial-probe
          path: |
            korea_dart_financial_probe_rows.csv
            korea_dart_financial_probe_summary.json
          if-no-files-found: error
