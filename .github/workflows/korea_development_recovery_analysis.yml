name: Korea Development Recovery Analysis

on:
  push:
    paths:
      - .github/workflows/korea_development_recovery_analysis.yml
      - korea_development_multiyear_v1.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests pyarrow
      - name: Download recovered accounting aggregate
        uses: actions/download-artifact@v4
        with:
          name: korea-dart-quarterly-2016-2020-recovered
          path: recovered
          repository: sjh5966-spec/SeolDoA
          run-id: 34545260411
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage recovered aggregate
        run: |
          cp recovered/korea_dart_quarterly_2016_2020_recovered.csv .
          cp recovered/korea_dart_quarterly_2016_2020_recovered_summary.json .
          cat korea_dart_quarterly_2016_2020_recovered_summary.json
      - name: Run multiyear Development analysis
        run: python korea_development_multiyear_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-development-recovered-analysis
          retention-days: 30
          path: |
            korea_dart_quarterly_2016_2020_recovered_summary.json
            korea_development_2018_2020_events.csv
            korea_development_threshold_grid.csv
            korea_development_multiyear_summary.json
      - name: Commit compact outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add korea_dart_quarterly_2016_2020_recovered_summary.json korea_development_threshold_grid.csv korea_development_multiyear_summary.json
          git diff --cached --quiet || git commit -m 'Update recovered Korea Development analysis'
          git push
