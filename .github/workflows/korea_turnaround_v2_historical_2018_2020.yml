name: Korea Turnaround V2 Historical 2018-2020
on:
  push:
    paths:
      - korea_turnaround_v2_historical_2018_2020.py
      - .github/workflows/korea_turnaround_v2_historical_2018_2020.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests pyarrow
      - name: Download completed 2016-2020 accounting
        uses: actions/download-artifact@v4
        with:
          name: korea-dart-quarterly-2016-2020-full
          path: accounting
          repository: sjh5966-spec/SeolDoA
          run-id: 34325367757
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cp accounting/korea_dart_quarterly_2016_2020_full.csv .
      - name: Download historical DART universes
        uses: actions/download-artifact@v4
        with:
          name: korea-dart-historical-universe-development
          path: universe
          repository: sjh5966-spec/SeolDoA
          run-id: 34320651415
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unchanged frozen V2 on 2018-2020
        run: python korea_turnaround_v2_historical_2018_2020.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-turnaround-v2-historical-2018-2020
          retention-days: 30
          path: |
            korea_turnaround_v2_historical_2018_2020_events.csv
            korea_turnaround_v2_historical_2018_2020_summary.json
