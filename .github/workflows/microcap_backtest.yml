name: Frozen Turnaround Validation

on:
  push:
    branches: [main]
    paths:
      - 'historical_turnaround_2010s.py'
      - 'modern_score4_regime_oos.py'
      - 'cross_era_horizon_validation.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  cross-era-horizons:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas scipy
      - name: Build historical events
        run: python historical_turnaround_2010s.py
      - name: Build modern events with retry
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if python modern_score4_regime_oos.py; then exit 0; fi
            echo "modern build attempt $i failed; retrying after cooldown"
            sleep 45
          done
          exit 1
      - name: Run cross-era horizon validation with retry
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if python cross_era_horizon_validation.py; then exit 0; fi
            echo "horizon attempt $i failed; retrying after cooldown"
            sleep 45
          done
          exit 1
      - name: Upload cross-era horizon results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-era-horizon-validation
          path: cross_era_horizon_results/
          if-no-files-found: warn
