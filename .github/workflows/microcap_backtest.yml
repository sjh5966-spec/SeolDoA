name: Holdout Turnaround Shock Score

on:
  push:
    branches: [main]
    paths:
      - 'holdout_shock_score.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install duckdb scipy
      - name: Run holdout shock score analysis
        run: python holdout_shock_score.py
      - name: Upload holdout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdout-shock-score
          path: holdout_results/
          if-no-files-found: warn
