name: Full Microcap EBIT Turnaround Backtest

on:
  push:
    branches: [main]
    paths:
      - 'hf_microcap_backtest.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb
      - name: Run full event study
        run: python hf_microcap_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microcap-ebit-turnaround-results
          path: results/
          if-no-files-found: warn
