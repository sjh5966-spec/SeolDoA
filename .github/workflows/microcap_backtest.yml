name: Frozen Historical Turnaround Backtest

on:
  push:
    branches: [main]
    paths:
      - 'historical_turnaround_2010s.py'
      - 'historical_regime_analysis.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas scipy
      - name: Run frozen historical backtest
        run: python historical_turnaround_2010s.py
      - name: Run market regime analysis
        run: python historical_regime_analysis.py
      - name: Upload historical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-turnaround-results
          path: historical_results/
          if-no-files-found: warn
