name: Historical XBRL Tag Probe

on:
  push:
    branches: [main]
    paths:
      - 'probe_historical_tags.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb
      - name: Probe historical tags
        run: python probe_historical_tags.py
