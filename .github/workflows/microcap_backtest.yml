name: Probe Hugging Face Parquet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb
      - name: Probe schemas
        run: |
          python - <<'PY'
          import duckdb
          base='https://huggingface.co/datasets/defeatbeta/yahoo-finance-data/resolve/main/data/'
          files=['stock_statement.parquet','stock_prices.parquet','stock_shares_outstanding.parquet','stock_sec_filing.parquet']
          con=duckdb.connect()
          for f in files:
              url=base+f
              print('\n===', f, '===')
              try:
                  schema=con.execute(f"DESCRIBE SELECT * FROM read_parquet('{url}')").fetchall()
                  print('SCHEMA')
                  for row in schema:
                      print(row)
                  rows=con.execute(f"SELECT * FROM read_parquet('{url}') LIMIT 3").fetchall()
                  print('ROWS')
                  for row in rows:
                      print(row)
              except Exception as e:
                  print('ERROR',repr(e))
          PY
