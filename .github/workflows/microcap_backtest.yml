name: A Signal Growth Driver Analysis

on:
  push:
    branches: [main]
    paths:
      - 'analyze_a_growth_drivers.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb
      - name: Analyze A growth drivers
        run: python analyze_a_growth_drivers.py
      - name: Upload growth results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-signal-growth-drivers
          path: growth_results/
          if-no-files-found: warn
