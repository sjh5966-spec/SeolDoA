name: A Tail Structure Analysis

on:
  push:
    branches: [main]
    paths:
      - 'tail_structure_analysis.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install duckdb scipy
      - name: Analyze A tail structure
        run: python tail_structure_analysis.py
      - name: Upload tail results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-tail-structure
          path: tail_results/
          if-no-files-found: warn
