name: Frozen Turnaround Validation

on:
  push:
    branches: [main]
    paths:
      - 'historical_turnaround_2010s.py'
      - 'historical_regime_analysis.py'
      - 'modern_score4_regime_oos.py'
      - 'leave_one_out_score4.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  leave-one-out:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas scipy
      - name: Run historical frozen backtest
        run: python historical_turnaround_2010s.py
      - name: Run modern frozen OOS build
        run: python modern_score4_regime_oos.py
      - name: Run leave-one-out validation
        run: python leave_one_out_score4.py
      - name: Upload leave-one-out results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score4-leave-one-out
          path: loo_results/
          if-no-files-found: warn
