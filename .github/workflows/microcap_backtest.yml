name: Filtered A vs D Comparison

on:
  push:
    branches: [main]
    paths:
      - 'compare_filtered_a_vs_d.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb
      - name: Compare filtered A vs D
        run: python compare_filtered_a_vs_d.py
      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-a-vs-d
          path: compare_results/
          if-no-files-found: warn
