name: SECDatabase Parquet Test

on:
  push:
    branches: [main]
    paths:
      - 'test_secdatabase_s3.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb
      - name: Test public parquet mirror
        run: python test_secdatabase_s3.py
