name: Frozen Turnaround Validation

on:
  push:
    branches: [main]
    paths:
      - 'historical_turnaround_2010s.py'
      - 'historical_regime_analysis.py'
      - 'modern_score4_regime_oos.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  modern-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas scipy
      - name: Run modern frozen OOS regime test
        run: python modern_score4_regime_oos.py
      - name: Upload modern OOS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-score4-regime-oos
          path: modern_regime_results/
          if-no-files-found: warn
