name: SEC FSDS Download Test

on:
  push:
    branches: [main]
    paths:
      - 'test_sec_fsds_download.py'
      - '.github/workflows/microcap_backtest.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SEC quarterly dataset download
        run: python test_sec_fsds_download.py
