name: US Microcap EBIT Turnaround Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/microcap_backtest.yml']

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated runner
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > runner.py
          python -m py_compile runner.py
      - name: Install dependencies
        run: python -m pip install 'duckdb>=1.3' 'numpy>=1.26' 'pandas>=2.2' 'requests>=2.31'
      - name: Run full event study
        env:
          SEC_USER_AGENT: 'microcap-turnaround-research sjh5966-spec@users.noreply.github.com'
        run: python runner.py --workdir results --start-year 2015 --end-year 2026
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microcap-ebit-turnaround-results
          path: results/
          if-no-files-found: warn
      - name: Commit outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/events.csv results/summary.csv results/diagnostics.json results/candidates_pre_marketcap.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Update microcap EBIT turnaround backtest results'
          git push
