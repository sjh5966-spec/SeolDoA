name: Korea DART 2015 XBRL Fact Smoke

on:
  push:
    paths:
      - korea_dart_2015_xbrl_fact_smoke.py
      - .github/workflows/korea_dart_2015_xbrl_fact_smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests lxml
      - name: Inspect 3x3 XBRL facts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python korea_dart_2015_xbrl_fact_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-dart-2015-xbrl-fact-smoke
          path: korea_dart_2015_xbrl_fact_smoke.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea_dart_2015_xbrl_fact_smoke.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect Korea DART 2015 XBRL fact smoke'
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i*3))
          done
          echo 'Push race persisted; artifact preserves result'
