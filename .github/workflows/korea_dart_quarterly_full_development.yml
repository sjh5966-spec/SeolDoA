name: Korea DART Full Development Quarterly Accounting

on:
  push:
    paths:
      - .github/workflows/korea_dart_quarterly_full_development.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: python
        run: |
          import json, os, pandas as pd
          d=pd.read_csv('korea_dart_historical_seed_2015_2020.csv',dtype=str)
          items=[]
          size=100
          for y in range(2016,2021):
              n=int((d.fiscal_year.astype(str)==str(y)).sum())
              for c in range((n+size-1)//size):
                  items.append({'year':y,'chunk':c,'size':size})
          assert len(items)<=256
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':items},separators=(',',':'))+'\n')
          print('jobs',len(items),items[:3],items[-3:])
      - run: echo 'Development only; 2023+ OOS is not accessed.'

  collect:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Collect one historical corp-year chunk
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_QUARTER_YEAR: ${{ matrix.year }}
          DART_QUARTER_CHUNK: ${{ matrix.chunk }}
          DART_QUARTER_CHUNK_SIZE: ${{ matrix.size }}
        run: python korea_dart_quarterly_collector_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: qacct-${{ matrix.year }}-${{ matrix.chunk }}
          retention-days: 14
          path: |
            korea_dart_quarterly_v2_${{ matrix.year }}_chunk*.csv
            korea_dart_quarterly_v2_${{ matrix.year }}_chunk*_summary.json

  aggregate:
    needs: collect
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qacct-*
          path: chunks
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Aggregate compact accounting output and QC
        shell: python
        run: |
          from pathlib import Path
          import pandas as pd, json
          fs=sorted(Path('chunks').glob('korea_dart_quarterly_v2_*_chunk*.csv'))
          if not fs: raise SystemExit('no chunk outputs')
          ds=[pd.read_csv(f,dtype={'corp_code':str}) for f in fs]
          d=pd.concat(ds,ignore_index=True)
          d=d[d.business_year.astype(int).between(2016,2020)].copy()
          d.to_csv('korea_dart_quarterly_2016_2020_full.csv',index=False)
          s={
            'development_only':True,'modern_oos_protected':True,'files':len(fs),'rows':len(d),
            'unique_corps':int(d.corp_code.nunique()),
            'year_counts':d.business_year.value_counts().sort_index().to_dict(),
            'op_populated':int(d.operating_profit_q.notna().sum()),
            'ni_populated':int(d.net_income_q.notna().sum()),
            'equity_populated':int(d.equity_q_end.notna().sum()),
            'cfo_populated':int(d.cfo_q.notna().sum()),
            'fcf_populated':int(d.fcf_q.notna().sum()),
            'basis_switch_or_noncomparable':int((~d.basis_comparable_to_immediate_predecessor.astype(bool)).sum()),
            'note':'Accounting reconstruction only; no signal dates, returns, or 2023+ data.'}
          Path('korea_dart_quarterly_2016_2020_full_summary.json').write_text(json.dumps(s,ensure_ascii=False,indent=2))
          print(json.dumps(s,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: korea-dart-quarterly-2016-2020-full
          retention-days: 14
          path: |
            korea_dart_quarterly_2016_2020_full.csv
            korea_dart_quarterly_2016_2020_full_summary.json
